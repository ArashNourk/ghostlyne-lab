name: ghostlyne-registry
on:
  workflow_dispatch:
    inputs:
      step: {description: "probe or fetch", default: "probe"}
  push:
    paths: ["registry/probe.py", "registry/sources.py", "registry/fetch.py", ".github/workflows/registry.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pandas requests openpyxl
      - name: Run step
        run: |
          STEP="${{ github.event.inputs.step || 'probe' }}"
          if [ -f registry/fetch.py ] && [ "$STEP" = "fetch" ] || grep -q '^STEP=fetch' registry/STEP 2>/dev/null; then STEP=fetch; fi
          cd registry && python $STEP.py && cd ..
          echo "STEP=$STEP" >> $GITHUB_ENV
      - name: Push output to the registry-data branch
        run: |
          git config user.name "ghostlyne-bot"; git config user.email "actions@users.noreply.github.com"
          mv registry/out /tmp/out
          git checkout --orphan registry-data; git rm -rq --cached . ; rm -rf ./*
          cp -r /tmp/out/* . ; git add -A
          git commit -qm "Registry $STEP $(date -u +%FT%TZ)"; git push -f origin registry-data
