name: ghostlyne-odds
on:
  schedule:
    - cron: "15 23 * * *"   # 23:15 UTC: the information cut; forecast for the next UTC day
  push:
    paths: ["engine/**", "docs/index.html", ".github/workflows/odds.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ghostlyne-odds
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn requests pyarrow arch
      - uses: actions/cache@v4
        with:
          path: data
          key: data-v2-${{ github.run_id }}
          restore-keys: data-v2-
      - name: Backtest v2 (on code changes)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[backtest]')
        run: python engine/backtest.py
      - name: Forecast, score, ledger, site
        run: python engine/daily.py
      - name: Commit and push
        run: |
          git config user.name "ghostlyne-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger docs/data.json docs/ledger results || true
          git commit -m "Ghostlyne odds $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase || true
          git push
      - name: Verify public availability and record it
        run: python engine/publish_check.py
      - name: Commit publication record
        if: always()
        run: |
          git add ledger docs/ledger || true
          git commit -m "Publication verified $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase || true
          git push
