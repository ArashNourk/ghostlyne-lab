name: ghostlyne-odds
on:
  schedule:
    - cron: "15 23 * * *"   # 23:15 UTC: publish before the next UTC day opens
  push:
    paths: ["engine/**", "docs/index.html", ".github/workflows/odds.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ghostlyne-odds
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy scipy scikit-learn requests pyarrow
      - uses: actions/cache@v4
        with:
          path: data/candles
          key: candles-v1-${{ github.run_id }}
          restore-keys: candles-v1-
      - name: Backtest (on code changes)
        if: github.event_name != 'schedule'
        run: python engine/backtest.py
      - name: Today's odds, score yesterday, update ledger and site
        run: python engine/daily.py
      - name: Commit
        run: |
          git config user.name "ghostlyne-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ledger docs/data.json docs/ledger results || true
          git commit -m "Ghostlyne odds $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase || true
          git push
